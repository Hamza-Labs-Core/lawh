<!doctype html><html><head><meta charset="utf-8"><title>Focus</title></head><body><h1>Focus</h1><input id="i"><button id="go">Go</button>
<script>
const again = () => { document.getElementById('i').focus(); parent.postMessage({ type: 'lawh:open-media', index: 0, total: 1, label: 'x', background: 'rgb(0, 0, 0)', kind: 'none' }, '*'); };
document.getElementById('go').addEventListener('click', again);
addEventListener('focus', () => setTimeout(again, 5030));
</script></body></html>
