<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lawh mockups</title>
<style>
:root{--bg:#12161a;--s1:#1a2026;--s2:#232b33;--line:#34404b;--tx:#eef2f4;--mut:#a3b0ba;--ac:#e0b15a;--acx:#1b1406;--ok:#6fcf97;--warn:#f2b36b}
:root[data-mode=light]{--bg:#f6f4ef;--s1:#fff;--s2:#eeeae1;--line:#d6cfc0;--tx:#1d2329;--mut:#5a646d;--ac:#8a5a0b;--acx:#fff;--ok:#1b7a45;--warn:#97560a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Geeza Pro",sans-serif}
button,input,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.logo{font-weight:700;font-size:20px}.sp{flex:1}.ic{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:none;padding:0 12px}
nav{display:flex;gap:4px}nav a{padding:10px 14px;border-radius:10px;color:var(--mut)}nav a.on{background:var(--s2);color:var(--tx)}
.b{display:inline-block;background:var(--ac);color:var(--acx);border-radius:99px;padding:0 8px;font-size:13px;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:16px}h1{font-size:24px;margin:6px 0 14px}h2{font-size:18px;margin:0 0 8px}
.search{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s1);padding:0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:none;font-size:14px}.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px}.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:13px;border-radius:99px;padding:2px 10px;border:1px solid currentColor}.st.w{color:var(--warn)}.st.o{color:var(--ok)}.st.m{color:var(--mut)}
.split{display:grid;gap:16px;grid-template-columns:1fr 380px}.frame{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:520px}
.ph{border:1px dashed var(--line);border-radius:10px;background:var(--s2);padding:12px;margin:12px 0}
.opt{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.opt.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none;margin-top:2px}.on .dot{border:6px solid var(--ac)}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px}
.pri{background:var(--ac);color:var(--acx);border:0;border-radius:12px;min-height:48px;padding:0 20px;font-weight:600;width:100%;margin-top:10px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs span{padding:10px 14px;color:var(--mut)}.tabs .on{color:var(--tx);border-bottom:2px solid var(--ac)}
.cm{border-inline-start:3px solid var(--ac);padding:4px 12px;margin:12px 0}.cm.a{border-color:var(--line);margin-inline-start:20px}
.view{position:fixed;inset:0;background:#0a0c0e;color:#eef2f4;display:flex;flex-direction:column;z-index:9}.view .bar{display:flex;gap:8px;padding:12px;align-items:center}.view .ic{border-color:#46525d}.view .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;min-height:0}.view svg{flex:1;min-width:0;max-height:100%;background:#fff;border-radius:8px}
.sheet{display:none}.bot{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:start;padding:12px 8px;border-bottom:1px solid var(--line)}
.sign{max-width:420px;margin:14vh auto;text-align:center}
@media(max-width:760px){.split{grid-template-columns:1fr}.top nav{display:none}.bot{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--s1);border-top:1px solid var(--line);justify-content:space-around;padding:4px 2px 12px}.bot a{display:grid;place-items:center;min-height:44px;min-width:44px;padding:4px;color:var(--mut);font-size:13px;text-align:center}.bot a.on{color:var(--ac)}main{padding-bottom:96px}.frame{min-height:300px}.hm{display:none}.sheet{display:grid;place-items:center;position:fixed;bottom:74px;inset-inline:16px;width:auto;box-shadow:0 4px 20px #0006}.view .mid{padding:0}.view .mid .ic{position:absolute;bottom:64px;background:#0a0c0e}.view .mid .ic:first-child{inset-inline-start:16px}.view .mid .ic:last-child{inset-inline-end:16px}.split aside{display:none}}
</style></head><body><script>
const q=new URLSearchParams(location.search),L=q.get('lang')||'en',S=q.get('screen')||'library',ar=L=='ar';
const R=document.documentElement;R.lang=L;R.dir=ar?'rtl':'ltr';R.dataset.mode=q.get('mode')||'dark';
const n=x=>ar?String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(x);
const T=(e,a)=>ar?a:e;
const nav=[['library',T('Pages','الصفحات')],['inbox',T('Decisions','القرارات')+` <span class="b">${n(3)}</span>`],['comments',T('Comments','التعليقات')],['team',T('Teams','الفرق')],['keys',T('Settings','الإعدادات')]];
const on=S=='page'||S=='viewer'?'library':S=='invite'||S=='people'?'team':S=='connect'||S=='code'?'keys':S;
const navH=nav.map(([k,v])=>`<a href="?screen=${k}&lang=${L}&mode=${R.dataset.mode}" class="${k==on?'on':''}">${v}</a>`).join('');
const top_=`<div class="top"><span class="logo">${T('Lawh','لوح')}</span><nav>${navH}</nav><span class="sp"></span><button class="ic">${R.dataset.mode=='dark'?T('Light','فاتح'):T('Dark','داكن')}</button><button class="ic">${T('العربية','English')}</button></div>`;
const top0=top_.replace(/<nav>.*<\/nav>/,'');
const bot=`<div class="bot">${navH}</div>`;
const st=(c,t)=>`<span class="st ${c}">${t}</span>`;
const rev=st('w',T('In review','قيد المراجعة')),dec=st('o',T('Decided','حُسم')),dr=st('m',T('Draft','مسودة'));
const pages=[[T('Photo storage options','خيارات تخزين الصور'),T('Garden app','تطبيق الحديقة'),rev,2,4],[T('Onboarding screens review','مراجعة شاشات البداية'),T('Garden app','تطبيق الحديقة'),rev,1,2],[T('Weather provider comparison','مقارنة مزوّدي الطقس'),T('Field notes','ملاحظات ميدانية'),dec,0,7],[T('Weekly build dashboard','لوحة البناء الأسبوعية'),T('Field notes','ملاحظات ميدانية'),dr,0,12]];
const opts=[[T('Object storage','تخزين الكائنات'),T('Recommended','موصى به'),T('About $2 a month','نحو ٢ دولار شهريًا')],[T('Database blobs','داخل قاعدة البيانات'),'',T('About $30 a month','نحو ٣٠ دولارًا شهريًا')],[T('Keep files on the device','إبقاء الملفات على الجهاز'),'',T('No cost, no sync','بلا تكلفة، وبلا مزامنة')]];
const chart=`<svg viewBox="0 0 400 170" role="img" width="100%"><g font-size="13" fill="currentColor" font-family="system-ui"><rect x="40" y="130" width="70" height="10" fill="#c48a26"/><rect x="160" y="30" width="70" height="110" fill="#6f8494"/><rect x="280" y="138" width="70" height="2" fill="#6f8494"/><text x="75" y="160" text-anchor="middle">${n(2)}</text><text x="195" y="160" text-anchor="middle">${n(30)}</text><text x="315" y="160" text-anchor="middle">${n(0)}</text></g></svg>`;
const form=`<h2>${T('Where should photos be stored?','أين تُخزَّن الصور؟')}</h2>${opts.map((o,i)=>`<label class="opt"><span class="dot"></span><span><b>${o[0]}</b> ${o[1]?`<span class="b">${o[1]}</span>`:''}<br><span class="mut">${o[2]}</span></span></label>`).join('')}<textarea placeholder="${T('Notes (optional)','ملاحظات (اختيارية)')}"></textarea><button class="pri">${T('Record decision','تسجيل القرار')}</button><p class="mut">${T('Nothing recorded yet. You can change an answer later; the history is kept.','لم يُسجَّل شيء بعد. يمكنك تغيير الإجابة لاحقًا، ويُحفظ السجل.')}</p>`;
const V={
library:`<h1>${T('Pages','الصفحات')}</h1><input class="search" placeholder="${T('Search pages','البحث في الصفحات')}"><div class="chips"><button class="chip on">${T('All projects','كل المشاريع')}</button><button class="chip">${T('Garden app','تطبيق الحديقة')}</button><button class="chip">${T('Field notes','ملاحظات ميدانية')}</button><button class="chip">${T('In review','قيد المراجعة')}</button><button class="chip">${T('Tags','الوسوم')}</button></div><div class="grid">${pages.map(p=>`<a class="card" href="?screen=page&lang=${L}&mode=${R.dataset.mode}"><div class="row">${p[2]}${p[3]?`<span class="b">${ar?(p[3]==2?'قراران مفتوحان':'قرار مفتوح'):p[3]+' open'}</span>`:''}</div><h2 style="margin-top:10px">${p[0]}</h2><div class="mut">${p[1]}، ${T('version','الإصدار')} ${n(p[4])}</div></a>`.replace('،',ar?'،':',')).join('')}</div>`,
page:`<div class="row"><a class="ic" style="display:grid;place-items:center" href="?screen=library&lang=${L}">${T('Back','رجوع')}</a><div><b>${pages[0][0]}</b><div class="mut">${pages[0][1]}</div></div><span class="sp"></span>${rev}<button class="ic">${T('Version','الإصدار')} ${n(4)}</button></div><div class="split" style="margin-top:14px"><div class="frame"><div class="mut">${T('Published by claude-agent','نشرها claude-agent')}</div><h1>${pages[0][0]}</h1><p>${T('Three ways to keep photos, compared by monthly cost and effort.','ثلاث طرق لحفظ الصور، مقارَنة بالتكلفة الشهرية والجهد.')}</p><div class="ph">${chart}<div class="mut">${T('Tap to open full size','الضغط للعرض بالحجم الكامل')}</div></div><h2>${T('Risks','المخاطر')}</h2><p>${T('Moving later means copying every photo once.','النقل لاحقًا يعني نسخ كل صورة مرة واحدة.')}</p></div><aside class="card"><div class="tabs"><span class="on">${T('Decisions','القرارات')} ${n(2)}</span><span>${T('Comments','التعليقات')} ${n(1)}</span><span>${T('History','السجل')}</span></div>${form}<button class="ic" style="width:100%">${T('Comment on a section','التعليق على قسم')}</button></aside></div><a class="pri sheet">${T('2 decisions to make','قراران بانتظارك')}</a>`,
inbox:`<h1>${T('Open decisions','القرارات المفتوحة')}</h1><div class="chips"><button class="chip on">${T('Open','مفتوحة')} ${n(3)}</button><button class="chip">${T('Question changed','تغيّر السؤال')} ${n(1)}</button><button class="chip">${T('Answered','مُجاب عنها')}</button></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))"><div class="card"><div class="mut">${pages[0][0]}</div>${form}</div><div class="card"><div class="mut">${pages[1][0]}</div><h2>${T('How many screens before sign-up?','كم شاشة قبل التسجيل؟')}</h2><div class="opt"><span class="dot"></span><span><b>${T('One','واحدة')}</b> <span class="b">${T('Recommended','موصى به')}</span></span></div><div class="opt"><span class="dot"></span><b>${T('Three','ثلاث')}</b></div><button class="pri">${T('Record decision','تسجيل القرار')}</button></div></div>`,
comments:`<h1>${T('Comments','التعليقات')}</h1><div class="card"><div class="row"><b>${pages[0][0]}</b><span class="mut">${T('Section: Risks','القسم: المخاطر')}</span></div><div class="cm"><b>${T('You','أنت')}</b><br>${T('How long would that copy take?','كم سيستغرق هذا النسخ؟')}</div><div class="cm a"><b>claude-agent</b> <span class="st m">${T('Agent','وكيل')}</span><br>${T('About 20 minutes for 10,000 photos.','نحو ٢٠ دقيقة لكل ١٠٬٠٠٠ صورة.')}</div><div class="cm a"><b>${T('Mona','منى')}</b> <span class="st o">${T('Decider','اتخاذ القرار')}</span><br>${T('That works for us.','هذا يناسبنا.')}</div><textarea placeholder="${T('Reply','رد')}"></textarea><div class="row"><button class="pri" style="width:auto">${T('Reply','رد')}</button><button class="ic" style="margin-top:10px">${T('Mark resolved','إغلاق النقاش')}</button></div></div>`,
keys:`<h1>${T('Agent keys','مفاتيح الوكلاء')}</h1><div class="card" style="overflow-x:auto"><table><tr><th>${T('Agent','الوكيل')}</th><th>${T('Person','الشخص')}</th><th>${T('Projects','المشاريع')}</th><th class="hm">${T('Can','الصلاحيات')}</th><th>${T('Expires','تنتهي')}</th><th></th></tr>${['claude-agent','gemini-agent','kimi-agent'].map((a,i)=>`<tr><td><b>${a}</b><br><bdi class="mut">${["laptop","laptop","home-server"][i]}</bdi></td><td>${i?T('Mona','منى'):T('Sara','سارة')}</td><td>${i?T('Field notes','ملاحظات ميدانية'):T('All','الكل')}</td><td class="hm mut">${T('Publish, read decisions, reply','النشر، وقراءة القرارات، والرد')}</td><td>${ar?`بعد ${n([90,61,12][i])} يومًا`:'in '+[90,61,12][i]+' days'}</td><td><button class="ic">${T('Revoke','إلغاء')}</button></td></tr>`).join('')}</table><div class="row"><a class="pri" style="width:auto;display:grid;place-items:center" href="?screen=code&lang=${L}&mode=${R.dataset.mode}">${T('Connect an agent','ربط وكيل')}</a><button class="ic" style="margin-top:10px">${T('Key for CI or a container','مفتاح للخوادم والحاويات')}</button></div></div><div class="card" style="margin-top:14px"><h2>${T('Tell any agent','عبارة الربط لأي وكيل')}</h2><p><code dir="ltr" style="overflow-wrap:anywhere">Connect to Lawh at https://lawh.example.com/connect.md</code></p><button class="ic">${T('Copy','نسخ')}</button></div>`,
code:`<div class="card" style="max-width:560px"><h1>${T('Connect an agent','ربط وكيل')}</h1><p>${T('Type the code your agent shows.','يلزم إدخال الرمز الذي يعرضه الوكيل.')}</p><input class="search" dir="ltr" aria-label="${T('Code','الرمز')}" style="background:var(--bg);color:var(--tx);font-size:24px;letter-spacing:4px;text-align:center" value="HKRT-WBXM"><button class="pri">${T('Continue','متابعة')}</button><p class="mut">${T('Continue only if you started this. If someone sent you a code, don’t type it.','المتابعة فقط إن كان هذا الطلب منك. أي رمز يصلك من شخص آخر يجب ألا يُكتب هنا.')}</p></div>`,
connect:`<div class="card" style="max-width:640px"><h1>${T('Connect an agent','ربط وكيل')}</h1><p class="mut">${T('It says it is <b>claude</b> on <b>laptop</b>. Started 1 minute ago.','يعرّف نفسه بأنه <b dir="ltr">claude</b> على <b dir="ltr">laptop</b>. بدأ قبل دقيقة.')}</p><h2>${T('Which agent is this?','أي وكيل هذا؟')}</h2><label class="opt on"><span class="dot"></span><span style="flex:1"><b>${T('A new agent','وكيل جديد')}</b><input class="search" dir="ltr" aria-label="${T('Agent name','اسم الوكيل')}" style="background:var(--bg);color:var(--tx);margin:8px 0 0" value="claude-laptop"></span></label><label class="opt"><span class="dot"></span><span><b dir="ltr">gemini-agent</b><br><span class="mut">${T('Yours already. Adds a key for this machine.','من وكلائك. يضاف له مفتاح لهذا الجهاز.')}</span></span></label><h2>${T('Projects','المشاريع')}</h2><div class="chips"><button class="chip on">${T('All projects','كل المشاريع')}</button><button class="chip">${T('Garden app','تطبيق الحديقة')}</button><button class="chip">${T('Field notes','ملاحظات ميدانية')}</button></div><p class="mut">${T('It can publish, read decisions and comments, and reply. It can’t answer decisions or delete pages. Ends in 90 days.','يمكنه النشر وقراءة القرارات والتعليقات والرد. لا يمكنه الإجابة عن القرارات أو حذف الصفحات. ينتهي بعد ٩٠ يومًا.')}</p><button class="pri">${T('Connect','ربط')}</button><button class="ic" style="width:100%;margin-top:10px">${T('Not mine','ليس لي')}</button></div>`,
team:`<div class="row"><h1>${T('Design team','فريق التصميم')}</h1><span class="sp"></span><a class="pri" style="width:auto;display:grid;place-items:center" href="?screen=invite&lang=${L}&mode=${R.dataset.mode}">${T('Invite','دعوة')}</a></div><div class="chips"><button class="chip on">${T('Design team','فريق التصميم')}</button><button class="chip">${T('Operations','فريق التشغيل')}</button><a class="chip" href="?screen=people&lang=${L}&mode=${R.dataset.mode}">${T('All people','كل الأشخاص')}</a><button class="chip">${T('New team','فريق جديد')}</button></div><div class="split" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))"><div class="card"><h2>${T('People','الأشخاص')} ${n(2)} <span class="mut">${T('and 1 invited','ودعوة واحدة')}</span></h2>${[[T('Mona','منى'),T('Manager','إدارة'),1],[T('Rami','رامي'),T('Decider','اتخاذ القرار'),1],[T('Lina','لينا'),T('Commenter, invited, link works for 2 more days','تعليق، دعوة لم تُستخدم بعد، الرابط صالح ليومين'),2]].map(m=>`<div class="row" style="border-bottom:1px solid var(--line);padding:10px 0"><div><b>${m[0]}</b><div class="mut">${m[1]}</div></div><span class="sp"></span>${m[2]?`<button class="ic">${m[2]==2?T('Cancel invite','إلغاء الدعوة'):T('Change','تغيير')}</button>`:''}</div>`).join('')}<button class="ic" style="margin-top:12px;width:100%">${T('Add someone who already joined','إضافة شخص منضم من قبل')}</button></div><div class="card"><h2>${T('Projects this team sees','المشاريع التي يراها الفريق')} ${n(2)}</h2>${[T('Garden app','تطبيق الحديقة'),T('Field notes','ملاحظات ميدانية')].map(x=>`<div class="row" style="border-bottom:1px solid var(--line);padding:10px 0"><b>${x}</b><span class="sp"></span><button class="ic">${T('Remove','إزالة')}</button></div>`).join('')}<button class="ic" style="margin-top:12px;width:100%">${T('Add a project','إضافة مشروع')}</button><p class="mut">${T('A project in no team is visible to the owner only.','المشروع غير المضاف إلى أي فريق لا يراه إلا المالك.')}</p></div></div>`,
people:`<h1>${T('All people','كل الأشخاص')}</h1><div class="chips"><a class="chip" href="?screen=team&lang=${L}&mode=${R.dataset.mode}">${T('Design team','فريق التصميم')}</a><button class="chip">${T('Operations','فريق التشغيل')}</button><button class="chip on">${T('All people','كل الأشخاص')}</button><button class="chip">${T('New team','فريق جديد')}</button></div><div class="card">${[[T('Sara','سارة'),T('Owner, sees every project','ملكية النسخة، كل المشاريع'),0],[T('Mona','منى'),T('Design team: manager. Operations: viewer','فريق التصميم: إدارة. فريق التشغيل: مشاهدة'),1],[T('Rami','رامي'),T('Design team: decider','فريق التصميم: اتخاذ القرار'),1],[T('Omar','عمر'),T('In no team','خارج الفرق'),1]].map(m=>`<div class="row" style="border-bottom:1px solid var(--line);padding:10px 0"><div><b>${m[0]}</b><div class="mut">${m[1]}</div></div><span class="sp"></span>${m[2]?`<div class="row"><button class="ic">${T('Reset sign-in','إعادة ضبط الدخول')}</button><button class="ic">${T('Remove','إزالة')}</button></div>`:''}</div>`).join('')}<p class="mut">${T('Removing someone ends their sign-in and their agents’ keys at once. Their answers stay.','الإزالة تنهي الدخول ومفاتيح الوكلاء فورًا، وتبقى الإجابات.')}</p></div>`,
